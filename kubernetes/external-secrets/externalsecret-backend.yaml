apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudcart-backend-secret
  namespace: default

spec:
  refreshInterval: 1m

  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore

  target:
    name: cloudcart-backend-secret
    creationPolicy: Owner

  dataFrom:
    - extract:
        key: cloudcart/backend